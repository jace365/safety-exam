<style>

컨베이어 작업 시작 전 점검|원동기 및 풀리 기능;이탈 등 방지장치 기능;비상정지장치 기능;원동기·회전축·기어·풀리 덮개 또는 울;재해원인: 잠금장치·꼬리표 미부착;대책: 잠금장치와 꼬리표 부착, 검사 시 기계 운전 정지
휴대용 연삭기·탁상용 연삭기|휴대용 연삭기 덮개 노출각도 180도 이내;숫돌 교체 시 작업 시작 전 1분 이상 시운전;교체 후 3분 이상 시운전;탁상용 연삭기: 끼임, 가해물 브레이크 패드
둥근톱|고정식 접촉예방장치: 가공재 상면과 덮개 하단 8mm 이내;덮개 하단과 테이블면 25mm 이내;방호장치: 반발예방장치, 톱날접촉예방장치;추가 표시: 덮개의 종류, 둥근톱 사용가능 치수;분할날: 톱날 뒷면 12mm 이내, 두께 톱날의 1.1배 이상

가스용접·가스집합용접장치|폭발 방지 방호장치: 안전기(역화방지기);배관 접합부: 플랜지·밸브·콕에 개스킷 사용;주관 및 분기관에 안전기 설치;하나의 취관에 안전기 2개 이상

방독마스크|흡수제 3가지: 활성탄, 소다라임, 호프카라이트;정화통 추가 표시 4가지: 파과곡선도, 사용시간 기록카드, 정화통 외부 측면 표시색, 사용상 주의사항;시험성능: 안면부 흡기저항, 배기저항, 누설률, 내부 이산화탄소 농도;도료·시너 취급: 유기화합물용 방독마스크

공기압축기 작업 전 점검 7가지|공기저장 압력용기 외관 상태;드레인밸브 조작 및 배수;압력방출장치 기능;언로드밸브 기능;윤활유 상태;회전부 덮개 또는 울;그 밖의 연결 부위 이상 유무
국소배기장치 덕트·후드|덕트 길이는 짧게, 굴곡부는 적게;접속부 안쪽은 돌출부 없게;청소구 설치;오염물질 쌓이지 않도록 이송속도 유지;연결부로 외부 공기 유입 방지;외부식·리시버식 후드는 발산원에 가장 가까운 위치
